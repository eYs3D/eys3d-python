# G62 video-mode catalog.
# Source: YMS025_G62 Datasheet Rev 0.6 (2025-02-26), Table 4.1.
#
# Usage:
#   pyeys3d.Config().enable_device("G62", mode_id=<id>)
#
# Camera:
#   USB 2.0 monochrome depth module, 640x480 mono sensor pair. Depth is
#   14-bit distance in millimeters.
#
# Mode schema (every field is required on every entry):
#   color.w / color.h     pixel resolution (0/0 = color stream off)
#   color.fmt             0 = raw YUYV, 1 = MJPEG
#   color.split_lr        true when the wire frame carries L|R side-by-side
#   depth.w / depth.h     pixel resolution (0/0 = depth stream off)
#   depth.dtype           eSPDI APC_DEPTH_DATA_* code (14-bit distance variants)
#   zd_index              rectify-LUT row for the active resolution group
#   fps                   physical frame rate
#   interleave            true = SDK splits color/depth from a unified stream
#                         (effective per-stream rate is fps / 2)
#   usb                   USB port type the mode needs (2 = USB2.0, 3 = USB3.0)
#   name                  human label, written to one shape so the catalogs
#                         read alike:
#                           <streams> <color>@<fps>[ + <depth> depth]
#                           [ interleave (SDK <rate>fps)][ (USB 2.0)]
#                         streams are L / R (raw) and L' / R' (rectified) with
#                         D for depth; a side-by-side pair is <w>(x2)x<h>;
#                         resolutions are always pixels, and the depth size is
#                         given whenever it differs from the color raster.

model: G62
pid: 0x0183
mono: true
ir: {min: 0, max: 96, default: 60}
depth_range_mm: {near: 100, far: 1500}
signature_mode: {2: 1}   # USB port type -> default mode

modes:
  1:
    name: "L'+D 640x480@25"
    usb: 2
    color: {w: 640, h: 480, fmt: 1, split_lr: false}
    depth: {w: 640, h: 480, dtype: 2}
    zd_index: 2
    fps: 25
    interleave: false

  2:
    name: "L'+D 640x480@10"
    usb: 2
    color: {w: 640, h: 480, fmt: 1, split_lr: false}
    depth: {w: 640, h: 480, dtype: 2}
    zd_index: 2
    fps: 10
    interleave: false

  3:
    name: "L'+D 320x240@30"
    usb: 2
    color: {w: 320, h: 240, fmt: 1, split_lr: false}
    depth: {w: 320, h: 240, dtype: 2}
    zd_index: 3
    fps: 30
    interleave: false

  4:
    name: "L'+D 320x240@10"
    usb: 2
    color: {w: 320, h: 240, fmt: 1, split_lr: false}
    depth: {w: 320, h: 240, dtype: 2}
    zd_index: 3
    fps: 10
    interleave: false

  5:
    name: "L'+R'+D 640(x2)x480@25 + 640x480 depth"
    usb: 2
    color: {w: 1280, h: 480, fmt: 1, split_lr: true}
    depth: {w:  640, h: 480, dtype: 2}
    zd_index: 2
    fps: 25
    interleave: false

  6:
    name: "L'+R'+D 320(x2)x240@30 + 320x240 depth"
    usb: 2
    color: {w: 640, h: 240, fmt: 1, split_lr: true}
    depth: {w: 320, h: 240, dtype: 2}
    zd_index: 3
    fps: 30
    interleave: false

  7:
    name: "L'+R'+D 640(x2)x480@10 + 640x480 depth"
    usb: 2
    color: {w: 1280, h: 480, fmt: 0, split_lr: true}
    depth: {w:  640, h: 480, dtype: 2}
    zd_index: 2
    fps: 10
    interleave: false

  8:
    name: "L'+R'+D 320(x2)x240@10 + 320x240 depth"
    usb: 2
    color: {w: 640, h: 240, fmt: 0, split_lr: true}
    depth: {w: 320, h: 240, dtype: 2}
    zd_index: 3
    fps: 10
    interleave: false

  9:
    name: "D-only 640x480@10"
    usb: 2
    color: {w: 0, h: 0, fmt: 1, split_lr: false}
    depth: {w: 640, h: 480, dtype: 2}
    zd_index: 2
    fps: 10
    interleave: false

  # Known firmware issue: on current G62 firmware this mode delivers about
  # 10 fps, not the 25 it declares. Measured 10.1 fps against 25.0 for
  # mode 1 at the same raster, so it is the depth-only path rather than the
  # raster. The rate below is the mode's nominal one and is left as the
  # catalog declares it; the firmware fix is with the module team.
  10:
    name: "D-only 640x480@25"
    usb: 2
    color: {w: 0, h: 0, fmt: 1, split_lr: false}
    depth: {w: 640, h: 480, dtype: 2}
    zd_index: 2
    fps: 25
    interleave: false

  11:
    name: "D-only 320x240@10"
    usb: 2
    color: {w: 0, h: 0, fmt: 1, split_lr: false}
    depth: {w: 320, h: 240, dtype: 2}
    zd_index: 3
    fps: 10
    interleave: false

  12:
    name: "D-only 320x240@30"
    usb: 2
    color: {w: 0, h: 0, fmt: 1, split_lr: false}
    depth: {w: 320, h: 240, dtype: 2}
    zd_index: 3
    fps: 30
    interleave: false

  13:
    name: "L+R 640(x2)x480@10"
    usb: 2
    color: {w: 1280, h: 480, fmt: 0, split_lr: true}
    depth: {w: 0, h: 0, dtype: 0}
    zd_index: 2
    fps: 10
    interleave: false

  14:
    name: "L+R 320(x2)x240@10"
    usb: 2
    color: {w: 640, h: 240, fmt: 0, split_lr: true}
    depth: {w: 0, h: 0, dtype: 0}
    zd_index: 3
    fps: 10
    interleave: false

  15:
    name: "L+R+D 640(x2)x480@10 + 640x480 depth"
    usb: 2
    color: {w: 1280, h: 480, fmt: 0, split_lr: true}
    depth: {w:  640, h: 480, dtype: 7}
    zd_index: 2
    fps: 10
    interleave: false
